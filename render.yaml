# Render blueprint. Import this repo as a Blueprint and Render reads this file.
#
# Note on the plan: SQLite keeps its data in a file, and only paid instances can have a
# disk. On Render's free plan the filesystem is wiped whenever the instance restarts, so
# anything the Zaps sent would disappear — fine for an hour's testing, no good for a
# side-by-side comparison over several days. Hence "starter" plus a 1 GB disk.
services:
  - type: web
    name: pluginboard
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "echo no build step"
    startCommand: "node server.js"
    healthCheckPath: /health
    disk:
      name: board-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
      - key: DB_FILE
        value: /var/data/board.db
      - key: PEOPLE
        value: Andre,Andy,Andreas
      # These three are set in the Render dashboard, not here — they are secrets.
      - key: INGEST_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_SECRET
        sync: false
      # Connecteam workflows. Flip to "live" only once the deduction and Troubleshoot Zaps are OFF.
      - key: AUTOMATION_MODE
        value: shadow
      - key: EOJ_FORM_ID
        sync: false
      - key: CONNECTEAM_API_KEY
        sync: false
      - key: CONNECTEAM_WEBHOOK_SECRET
        sync: false
      - key: SORTLY_KEY
        sync: false
      - key: TROUBLESHOOT_FORM_ID
        sync: false
      - key: OTHER_INFO_FORM_ID
        sync: false
      - key: SLACK_HOOK
        sync: false
